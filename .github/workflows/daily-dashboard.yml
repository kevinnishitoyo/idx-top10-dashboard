name: Refresh and publish dashboard

on:
  workflow_dispatch:
  schedule:
    # 18:15 WIB and 21:00 (UTC+7), Monday-Friday.
    - cron: "15 11 * * 1-5"
    - cron: "0 14 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test technical setup rules
        run: python -m unittest discover -s tests

      - name: Download recent IDX summaries
        continue-on-error: true
        run: python idx_download.py --days 5

      - name: Import available IDX summaries
        run: python idx_summary.py

      - name: Build market report
        run: python pipeline.py

      - name: Build matching news report
        run: python news.py

      - name: Validate generated dashboard
        run: python scripts/validate_dashboard.py

      - name: Prepare website
        run: |
          mkdir -p public
          cp reports/dashboard.html public/index.html
          touch public/.nojekyll

      - name: Save refreshed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_data.db downloads raw reports
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
